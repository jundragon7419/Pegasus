<!doctype html>
<html lang="ko" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KWU Pegasus</title>

    <!-- FOUC 방지: React 가 로드되기 전에 테마를 확정한다.
         이 스크립트가 없으면 라이트로 한 번 그려진 뒤 다크로 뒤집히며 깜빡인다.
         기본값은 라이트다(prefers-color-scheme 을 따르지 않는다). -->
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem('theme') || 'light'
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>

    <!-- Pretendard: 한글·라틴 본문. Google Fonts 에 없어 jsDelivr 를 쓴다.
         dynamic-subset 은 필요한 글자만 내려받는다 — 전체 버전은 모바일에서 너무 무겁다. -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />

    <!-- Archivo: 숫자·영문 디스플레이(등번호·스탯·대문자 제목). 한글은 지원하지 않는다. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
